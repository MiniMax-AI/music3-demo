<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>MiniMax Music 3</title>
  <style>:root {
  --page:#f7f8fc;--surface:#fff;--surface-soft:#f1f2f8;--ink:#232326;
  --muted:#797b89;--line:#e1e3ea;--brand-blue:#F13D5D;
  --brand-blue-deep:#F13D5D;--brand-violet:#F13D5D;--dialog:#f7f8fc;
}
*{box-sizing:border-box}
html{background:var(--page);scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--page);font-family:Inter,"FunMusic CJK",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
body.layout-four{--demo-columns:4}
body.layout-three{--demo-columns:3}
body.dialog-open{overflow:hidden}
button,input{font:inherit}
button{color:inherit}
.topbar{position:sticky;z-index:20;top:0;height:60px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.94);backdrop-filter:blur(18px)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;width:min(1380px,calc(100% - 48px));height:100%;margin:auto}
.wordmark{display:inline-flex;align-items:center;gap:10px;font:600 15px/1 Inter,sans-serif;letter-spacing:-.02em;white-space:nowrap}
.wordmark-logo{display:block;width:38px;height:38px;flex:0 0 auto;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(88,55,220,.16))}
.topnav{display:flex;gap:22px;color:#555866;font-size:12px}
.topnav a{display:inline-flex;align-items:center;min-height:44px;text-decoration:none}
.topnav a:hover{color:var(--brand-blue)}
.hero{padding:44px 24px 18px;background:linear-gradient(180deg,#fff 0,#fafbff 70%,var(--page) 100%)}
.hero-inner{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.65fr);align-items:end;gap:clamp(36px,5vw,92px);width:100%;max-width:1380px;margin:auto}
.hero-title{min-width:0}
.eyebrow{margin:0 0 15px;color:var(--brand-blue);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.hero h1{max-width:840px;margin:0;font-family:"Source Serif 4","Times New Roman",serif;font-size:clamp(42px,7vw,74px);font-weight:400;line-height:1.02;letter-spacing:-.038em}
.title-rule{width:128px;height:3px;margin:25px 0 0;border-radius:3px;background:linear-gradient(90deg,var(--brand-blue),var(--brand-violet))}
.intro{min-width:0;width:100%;max-width:520px;justify-self:end;padding-bottom:4px}
.intro p{margin:0;color:#454753;font-family:"Source Serif 4","Times New Roman",serif;font-size:18px;line-height:1.62;overflow-wrap:anywhere}
.intro a{color:var(--brand-blue);font-weight:600;text-decoration-thickness:1px;text-underline-offset:3px}
main{padding:22px 24px 100px}
.demo-section{max-width:1380px;margin:auto;padding-top:58px;scroll-margin-top:74px}
.demo-section:first-child{padding-top:0}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:28px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:18px}
.section-heading h2{margin:0;font-family:"Source Serif 4","Times New Roman",serif;font-size:clamp(27px,3vw,39px);font-weight:400;letter-spacing:-.025em}
.section-heading p{max-width:690px;margin:7px 0 0;color:#626572;font-size:13px}
.demo-grid{display:grid;grid-template-columns:repeat(var(--demo-columns),minmax(0,1fr));gap:14px}
.demo-card{min-width:0;height:auto}
.album-card{position:relative;display:block;width:100%;height:auto;aspect-ratio:32/9;overflow:hidden;border:1px solid rgba(28,31,48,.11);border-radius:12px;padding:0;text-align:left;background:linear-gradient(135deg,#fff 0,#f5f6fb 100%);box-shadow:0 7px 22px rgba(27,32,62,.055);cursor:pointer;isolation:isolate;transform:translateY(0);transition:transform .16s,border-color .16s,box-shadow .16s}
.album-card:hover{transform:translateY(-1px);border-color:rgba(241,61,93,.3);box-shadow:0 10px 28px rgba(27,32,62,.095)}
.album-card:focus{outline:3px solid var(--brand-blue);outline-offset:3px}
.album-card:focus:not(:focus-visible){outline:none}
.album-card:focus-visible{outline:3px solid var(--brand-blue);outline-offset:3px}
.demo-card.is-current .album-card{border-color:var(--brand-blue);box-shadow:0 0 0 1px rgba(241,61,93,.55),0 11px 34px rgba(241,61,93,.13)}
.album-cover{position:absolute;z-index:-2;top:0;right:0;width:64%;height:100%;object-fit:cover;object-position:center;transform:scale(1.01);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%,#000 100%);-webkit-mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-image:linear-gradient(90deg,transparent 0,#000 38%,#000 100%);mask-repeat:no-repeat;mask-size:100% 100%}
.album-shade{position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,#fff 0,#f8f9fd 38%,rgba(248,249,253,.94) 45%,rgba(248,249,253,.52) 58%,rgba(248,249,253,.08) 74%,transparent 100%),linear-gradient(0deg,rgba(8,10,24,.12),transparent 56%);pointer-events:none}
.album-card-top{position:absolute;z-index:2;top:50%;right:13px;display:flex;align-items:center;transform:translateY(-50%)}
.card-source-data{display:none!important}
.card-play{display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(255,255,255,.48);border-radius:50%;color:#fff;background:rgba(9,12,27,.42);box-shadow:0 5px 18px rgba(5,7,20,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12px;text-indent:2px;transition:background-color .16s,transform .16s}
.album-card:hover .card-play{background:rgba(241,61,93,.72);transform:scale(1.025)}
.demo-card.is-current .card-play{border-color:rgba(255,255,255,.7);background:var(--brand-blue)}
.album-card-copy{position:absolute;z-index:1;top:50%;right:auto;left:18px;display:block;width:52%;color:var(--ink);transform:translateY(-50%)}
.album-title-row{display:grid;gap:4px;min-width:0;margin:0}
.album-title{overflow-wrap:anywhere;white-space:normal;font-family:"Source Serif 4",serif;font-size:clamp(17px,1.45vw,21px);font-weight:400;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.album-title-zh{color:#717482;font-size:11px;line-height:1.3}
.album-subtitle{color:#626572;font-family:"Inter",sans-serif;font-size:11px;font-weight:600;line-height:1.3;letter-spacing:.02em}
.nojs-audio{display:flex;align-items:center;min-height:44px;margin:7px 0 12px;padding:0 2px;color:var(--brand-blue);font-size:11px;overflow-wrap:anywhere}
.cover-grid{display:grid;gap:14px}
body.layout-four .cover-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body.layout-three .cover-grid{grid-template-columns:1fr;justify-items:center}
.cover-pair{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);align-items:center;width:100%;min-width:0}
body.layout-three .cover-pair{width:calc(66.666667% - 4.666667px)}
.cover-member-slot{min-width:0}
.cover-member{position:relative;display:block;width:100%;height:auto;min-height:44px;aspect-ratio:32/9;overflow:hidden;border:1px solid rgba(28,31,48,.11);border-radius:12px;padding:0;text-align:left;background:linear-gradient(112deg,#f1f2f5 0 49%,#e9ebfb 49% 100%);box-shadow:0 7px 22px rgba(27,32,62,.055);cursor:pointer;isolation:isolate;transform:translateY(0);transition:transform .16s,border-color .16s,box-shadow .16s}
.cover-member-art{position:absolute;z-index:-2;top:0;right:0;width:64%;height:100%;object-fit:cover;object-position:var(--cover-art-position,center);background:linear-gradient(135deg,#eceef4,#dfe3f8);pointer-events:none;user-select:none;transform:scale(1.01);-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%,#000 100%);-webkit-mask-repeat:no-repeat;-webkit-mask-size:100% 100%;mask-image:linear-gradient(90deg,transparent 0,#000 38%,#000 100%);mask-repeat:no-repeat;mask-size:100% 100%}
.cover-member::before{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,#fff 0,#f8f9fd 38%,rgba(248,249,253,.94) 45%,rgba(248,249,253,.54) 58%,rgba(248,249,253,.1) 76%,transparent 100%),linear-gradient(0deg,rgba(8,10,24,.13),transparent 58%);pointer-events:none}
.cover-member:hover{transform:translateY(-1px);border-color:rgba(241,61,93,.3);box-shadow:0 10px 28px rgba(27,32,62,.095)}
.cover-member:focus{outline:3px solid var(--brand-blue);outline-offset:3px}
.cover-member:focus:not(:focus-visible){outline:none}
.cover-member:focus-visible{outline:3px solid var(--brand-blue);outline-offset:3px}
.cover-member.is-current{border-color:var(--brand-blue);box-shadow:0 0 0 1px rgba(241,61,93,.55),0 11px 34px rgba(241,61,93,.13)}
.cover-member-copy{position:absolute;z-index:1;top:50%;left:18px;display:grid;width:calc(100% - 82px);min-width:0;gap:3px;transform:translateY(-50%)}
.cover-member-kind{color:#5f6372;font-size:9px;font-weight:600;line-height:1.1;letter-spacing:.13em;text-transform:uppercase}
.cover-member-genre{display:block;max-height:2.2em;overflow:hidden;color:var(--ink);font-family:"Source Serif 4",serif;font-size:clamp(15px,1.3vw,20px);font-weight:400;line-height:1.08;letter-spacing:-.018em;overflow-wrap:normal;word-break:normal;white-space:normal;text-wrap:balance}
.cover-member-play{position:absolute;z-index:2;top:50%;right:13px;display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(255,255,255,.7);border-radius:50%;color:#fff;background:rgba(36,42,78,.54);box-shadow:0 5px 18px rgba(5,7,20,.16);font-size:12px;text-indent:2px;transform:translateY(-50%);transition:background-color .16s,transform .16s}
.cover-member:hover .cover-member-play,.cover-member.is-current .cover-member-play{background:var(--brand-blue)}
.album-cover,.cover-member-art{transition:filter .3s ease,opacity .3s ease,transform .16s}
.cover-direction{display:flex;align-items:center;justify-content:center;width:14px;color:#666b7f;font-size:15px;line-height:1;pointer-events:none;user-select:none}
.cover-nojs-audio{display:flex;align-items:center;min-height:44px;margin:7px 0 12px;padding:0 2px;color:var(--brand-blue);font-size:11px;overflow-wrap:anywhere}
.record-dialog{width:min(1180px,calc(100vw - 48px));height:min(820px,calc(100dvh - 48px));max-width:none;max-height:none;overflow:hidden;border:1px solid rgba(35,35,38,.12);border-radius:20px;padding:0;color:var(--ink);color-scheme:light;background-color:var(--dialog);background-image:linear-gradient(135deg,#fff 0,#f5f6fb 100%);box-shadow:0 30px 90px rgba(26,31,52,.22),0 2px 10px rgba(26,31,52,.06)}
.record-dialog::backdrop{background:rgba(26,30,52,.38)}
.record-dialog[open]{animation:dialog-in .16s ease-out}
.record-dialog.is-closing{animation:dialog-out .16s ease-in forwards}
@keyframes dialog-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dialog-out{to{opacity:0;transform:translateY(5px)}}
.ambient-art{position:absolute;inset:0;overflow:hidden;contain:strict;pointer-events:none;transform:translateZ(0);background:#f7f8fc}
.ambient-art img{position:absolute;inset:-18px;width:calc(100% + 36px);height:calc(100% + 36px);object-fit:cover;image-rendering:auto;backface-visibility:hidden;filter:blur(6px) saturate(.5) brightness(1.12) contrast(.98);opacity:.8}
.ambient-art::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.32),rgba(248,249,253,.26))}
.record-dialog-surface{position:relative;z-index:1;height:100%;overflow:hidden;background:rgba(255,255,255,.02)}
.dialog-close{position:absolute;z-index:5;top:16px;right:16px;display:grid;place-items:center;width:44px;height:44px;border:1px solid rgba(35,35,38,.15);border-radius:50%;padding:0;color:#2b2d35;background:rgba(255,255,255,.82);box-shadow:0 6px 20px rgba(31,35,68,.09);font-size:26px;line-height:1;cursor:pointer}
.dialog-close:hover{color:var(--brand-blue);background:rgba(239,242,255,.94)}
.dialog-close:focus-visible,.transport-play:focus-visible,.seek-range:focus-visible,.cover-variant-switcher button:focus-visible{outline:3px solid var(--brand-blue);outline-offset:3px}
.record-dialog-grid{display:grid;grid-template-columns:minmax(0,5.5fr) minmax(360px,6.5fr);height:100%;overflow-anchor:none}
.listening-column{display:flex;min-width:0;flex-direction:column;align-items:center;overflow:auto;padding:26px 32px max(24px,env(safe-area-inset-bottom));background:rgba(255,255,255,.58);scrollbar-width:thin;overflow-anchor:none}
.player-heading{align-self:stretch;padding-right:46px;text-align:left}
.player-type{display:block;margin-bottom:5px;color:var(--brand-blue);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.player-heading h2{margin:0;font-family:"Source Serif 4",serif;font-size:clamp(28px,3.3vw,42px);font-weight:400;line-height:1.04;letter-spacing:-.028em}
.player-heading p{margin:4px 0 0;color:#4e5160;font-size:13px}
.dialog-caption{align-self:stretch;margin:12px 0 13px;border-left:2px solid #F13D5D;padding-left:13px;text-align:left}
.dialog-caption p{margin:0;color:#4e5160;font-size:11px;line-height:1.5;overflow-wrap:anywhere}
.dialog-caption p+p{margin-top:5px;color:#4e5160;font-size:10px}
.cover-variant-switcher{align-self:stretch;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 13px}
.cover-variant-switcher[hidden]{display:none!important}
.cover-variant-switcher button{min-height:44px;border:1px solid rgba(35,35,38,.15);border-radius:9px;padding:8px 11px;color:#444856;background:rgba(255,255,255,.7);font-size:11px;font-weight:600;line-height:1.25;text-align:left;overflow-wrap:anywhere;cursor:pointer}
.cover-variant-switcher button[aria-pressed="true"]{border-color:var(--brand-blue);color:#F13D5D;background:rgba(236,239,255,.96);box-shadow:0 0 0 1px rgba(241,61,93,.12)}
.turntable{position:relative;flex:none;width:min(26dvh,270px);height:min(26dvh,270px);min-width:190px;min-height:190px;margin:1px auto 9px}
.vinyl{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at center,#090a0e 0 7%,#1b1c23 7.2% 9%,#0c0d12 9.2% 16%,transparent 16.2%),repeating-radial-gradient(circle at center,#14151b 0 2px,#090a0e 3px 5px);box-shadow:0 18px 42px rgba(25,29,47,.24),0 3px 10px rgba(25,29,47,.14),inset 0 0 0 1px rgba(255,255,255,.12);animation:vinyl-spin 22s linear infinite;animation-play-state:paused}
.record-dialog.is-playing .vinyl{animation-play-state:running}
@keyframes vinyl-spin{to{transform:rotate(360deg)}}
.vinyl::after{content:"";position:absolute;inset:5%;border-radius:50%;background:linear-gradient(125deg,transparent 34%,rgba(255,255,255,.12) 45%,transparent 52%)}
.vinyl img{position:absolute;z-index:1;inset:29%;width:42%;height:42%;border:2px solid rgba(255,255,255,.34);border-radius:50%;object-fit:cover}
.vinyl-genre{position:absolute;z-index:1;inset:29%;display:none;place-items:center;border:2px solid rgba(255,255,255,.34);border-radius:50%;padding:8px;color:#292d43;background:linear-gradient(135deg,#edf0f7,#dfe3fa);font-family:"Source Serif 4",serif;font-size:clamp(11px,1.25vw,16px);font-weight:600;line-height:1.08;text-align:center;overflow-wrap:anywhere}
.vinyl-hole{position:absolute;z-index:2;top:calc(50% - 3px);left:calc(50% - 3px);width:6px;height:6px;border-radius:50%;background:#0c0d12}
.tonearm{position:absolute;z-index:3;top:-3%;right:0;width:43%;height:57%;transform:rotate(-14deg);transform-origin:75% 11%;transition:transform .3s ease}
.record-dialog.is-playing .tonearm{transform:rotate(3deg)}
.tonearm::before{content:"";position:absolute;top:2%;right:12%;width:34px;height:34px;border:7px solid #292d38;border-radius:50%;background:#0c0e15;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.tonearm::after{content:"";position:absolute;top:15%;right:27%;width:8px;height:75%;border-radius:5px;background:linear-gradient(90deg,#7c8291,#d2d5dc 45%,#555b68);transform:rotate(13deg);transform-origin:top}
.transport{align-self:stretch;margin-top:auto}
.visualizer-wrap{position:relative;height:64px;border:1px solid #dfe2eb;border-radius:9px;background:#f1f2f8;box-shadow:inset 0 1px 2px rgba(29,34,54,.05);overflow:hidden;contain:strict}
#rhythm-canvas{display:block;width:100%;height:100%}
.rhythm-fallback{position:absolute;inset:9px 7px;display:none;grid-template-columns:repeat(30,1fr);gap:3px}
.rhythm-fallback span{display:grid;min-width:0;grid-template-rows:repeat(7,1fr);gap:2px}
.rhythm-fallback i{display:block;min-height:2px;border-radius:1px;background:rgba(73,82,132,.13)}
.rhythm-fallback i.is-lit{background:rgba(241,61,93,.86)}
.rhythm-fallback span:nth-child(5n) i.is-lit,.rhythm-fallback span:nth-child(11n) i.is-lit{background:rgba(241,61,93,.8)}
.canvas-fallback #rhythm-canvas{display:none}
.canvas-fallback .rhythm-fallback{display:grid}
.transport-row{display:grid;grid-template-columns:44px 40px minmax(100px,1fr) 40px;align-items:center;gap:9px;margin-top:13px}
.transport-play{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;padding:0;color:#fff;background:var(--brand-blue);box-shadow:0 7px 20px rgba(241,61,93,.2);cursor:pointer;font-size:14px}
.transport-time{color:#666a78;font-size:10px;font-variant-numeric:tabular-nums;text-align:center}
.seek-range{width:100%;height:44px;margin:0;accent-color:#F13D5D;cursor:pointer}
.player-status{min-height:16px;margin:5px 0 0;color:#4e5160;font-size:9px;text-align:center}
#case-audio{display:none;width:100%;margin-top:8px;color-scheme:light}
.audio-fallback #case-audio{display:block}
.lyrics-column{min-width:0;overflow:auto;border-left:1px solid rgba(35,35,38,.11);padding:34px 38px 46px;background:rgba(255,255,255,.68);scrollbar-color:#c6cad7 transparent;overflow-anchor:none}
.lyrics-heading-row{position:sticky;z-index:2;top:-34px;display:flex;align-items:center;justify-content:space-between;margin:-1px 0 19px;padding:1px 52px 13px 0;background:linear-gradient(rgba(250,251,255,.97) 75%,transparent)}
.lyrics-heading-row h3{margin:0;font:400 22px "Source Serif 4",serif}
.lyrics-heading-row span{color:#4e5160;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
#player-lyrics{margin:0;color:#30323b;font:12px/1.74 Inter,"FunMusic CJK",sans-serif;white-space:pre-wrap;overflow-wrap:anywhere}
.record-dialog.cover-mode{background-color:#f1f2f6;background-image:var(--cover-modal-fallback,linear-gradient(112deg,#f1f2f5 0 49%,#e8eafb 49% 100%))}
.record-dialog.cover-mode .ambient-art{background:var(--cover-ambient-fallback,linear-gradient(112deg,#eff0f4 0 49%,#e4e7fb 49% 100%))}
.record-dialog.cover-mode .ambient-art img{display:block;filter:blur(8px) saturate(.64) brightness(1.12) contrast(.96);opacity:.82}
.record-dialog.cover-mode .ambient-art::after{background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(244,246,255,.24))}
.record-dialog.cover-mode .player-type,.record-dialog.cover-mode #player-title-zh,.record-dialog.cover-mode .dialog-caption{display:none}
.record-dialog.cover-mode .player-heading h2{font-size:clamp(24px,2.7vw,36px);line-height:1.1}
.record-dialog.cover-mode .vinyl img{display:block;background:linear-gradient(135deg,#edf0f7,#dfe3fa)}
.record-dialog.cover-mode .vinyl-genre:not([hidden]){inset:auto 24% 19%;display:grid;place-items:center;max-height:46px;overflow:hidden;border:1px solid rgba(255,255,255,.52);border-radius:999px;padding:5px 8px;color:#fff;background:rgba(9,12,27,.68);box-shadow:0 3px 12px rgba(5,7,20,.2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-family:Inter,"FunMusic CJK",sans-serif;font-size:clamp(9px,.85vw,11px);font-weight:600;line-height:1.15;letter-spacing:0;text-align:center;overflow-wrap:normal;word-break:normal}
.record-dialog.cover-mode .lyrics-heading-row span{display:none}
.record-dialog.cover-mode #player-lyrics.synced-lyrics.lyrics-static{display:block;padding:0;white-space:pre-wrap}
.record-dialog.cover-mode .synced-lyrics button.lyric-line{min-height:45px}
.record-dialog.instrumental .record-dialog-grid{display:flex;justify-content:center}
.record-dialog.instrumental .listening-column{width:min(720px,100%);padding-right:54px;padding-left:54px}
.record-dialog.instrumental .lyrics-column{display:none}
@media(max-width:1179px){.demo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover-grid{grid-template-columns:1fr!important}.cover-pair,body.layout-three .cover-pair{width:100%}.record-dialog-grid{grid-template-columns:minmax(0,1fr) minmax(320px,.94fr)}.listening-column{padding-right:26px;padding-left:26px}.lyrics-column{padding-right:27px;padding-left:27px}}

/* FunMusic v3 additive patch. Load after funmusic_qwen_record.css. */

/* Canonical lyrics remain the only displayed text. Timing controls emphasis. */
#player-lyrics.synced-lyrics {
  display:flex;
  flex-direction:column;
  gap:2px;
  margin:0;
  padding:clamp(34px,6vh,72px) 4px clamp(42px,12vh,124px);
  color:#30323b;
  font:14px/1.58 Inter,"FunMusic CJK",sans-serif;
  white-space:normal;
  overflow-wrap:anywhere;
  overflow-anchor:none;
}

#player-lyrics.synced-lyrics.lyrics-static {
  display:block;
  padding:0;
  white-space:pre-wrap;
}

.synced-lyrics .lyric-gap {
  flex:0 0 17px;
  height:17px;
}

.synced-lyrics .lyric-line {
  appearance:none;
  display:flex;
  align-items:center;
  width:100%;
  min-height:44px;
  margin:0;
  border:0;
  border-radius:10px;
  padding:8px 12px;
  color:#30323b;
  background:transparent;
  font:inherit;
  font-weight:450;
  letter-spacing:-.006em;
  text-align:left;
  text-wrap:pretty;
  opacity:1;
  transform:translate3d(0,0,0) scale(.988);
  transform-origin:left center;
  transition:
    color .22s ease,
    opacity .22s ease,
    transform .26s cubic-bezier(.2,.74,.25,1),
    background-color .22s ease,
    text-shadow .22s ease;
}

.synced-lyrics button.lyric-line {
  cursor:pointer;
}

.synced-lyrics button.lyric-line:hover {
  color:#232326;
  background:rgba(241,61,93,.055);
}

.synced-lyrics button.lyric-line:focus-visible {
  outline:3px solid #F13D5D;
  outline-offset:2px;
  color:#171923;
  background:rgba(241,61,93,.09);
}

.synced-lyrics .lyric-line.is-current-section {
  color:#2f323d;
  opacity:1;
}

.synced-lyrics .lyric-line.is-near {
  color:#343746;
  opacity:1;
}

.synced-lyrics .lyric-line.is-active {
  color:#F13D5D;
  background:linear-gradient(90deg,rgba(241,61,93,.11),rgba(241,61,93,.055) 66%,transparent);
  font-weight:720;
  opacity:1;
  transform:translate3d(0,-3px,0) scale(1.018);
  text-shadow:0 7px 24px rgba(42,62,210,.14);
}

.synced-lyrics .lyric-line.is-source-heading {
  min-height:30px;
  padding-top:13px;
  padding-bottom:3px;
  color:#F13D5D;
  font-size:10px;
  font-weight:650;
  letter-spacing:.14em;
  text-transform:uppercase;
}

/*
 * The v3 tonearm is an inline SVG with independently rendered base, bearing,
 * counterweight, arm tube, headshell, cartridge and stylus. Only the moving
 * assembly rotates; the plinth/base does not slide around the record.
 */
.tonearm.tonearm-v3 {
  position:absolute;
  z-index:4;
  top:-2.5%;
  right:-2.5%;
  width:49%;
  height:72%;
  pointer-events:none;
  transform:none;
  transform-origin:initial;
  transition:none;
  filter:drop-shadow(0 8px 10px rgba(27,30,46,.24));
}

.record-dialog.is-playing .tonearm.tonearm-v3 {
  transform:none;
}

.tonearm.tonearm-v3::before,
.tonearm.tonearm-v3::after {
  content:none;
}

.tonearm-v3 .tonearm-svg {
  display:block;
  width:100%;
  height:100%;
  overflow:visible;
}

.tonearm-v3 .tonearm-moving {
  transform:rotate(-8deg);
  transform-box:view-box;
  transform-origin:166px 58px;
  transition:transform .34s cubic-bezier(.22,.72,.24,1);
  will-change:transform;
}

.record-dialog.is-playing .tonearm-v3 .tonearm-moving {
  transform:rotate(4deg);
}

.tonearm-v3 .tonearm-tube-highlight {
  opacity:.76;
}

.tonearm-v3 .tonearm-stylus {
  stroke:#e4d8ca;
  stroke-width:1.2;
  stroke-linecap:round;
}

@media(max-width:719px) {
  #player-lyrics.synced-lyrics {
    gap:1px;
    padding:30px 0 calc(74px + env(safe-area-inset-bottom));
    font-size:15px;
    line-height:1.56;
  }

  .synced-lyrics .lyric-line {
    padding-right:8px;
    padding-left:8px;
  }

  .synced-lyrics .lyric-line.is-active {
    transform:translate3d(0,-2px,0) scale(1.012);
  }
}

@media(max-width:900px) and (max-height:520px) and (orientation:landscape) {
  #player-lyrics.synced-lyrics {
    padding-top:30px;
    padding-bottom:74px;
  }
}

@media(prefers-reduced-motion:reduce) {
  .album-cover,.cover-member-art{transition:none}

  .synced-lyrics .lyric-line {
    transition:none;
    transform:none;
  }

  .synced-lyrics .lyric-line.is-active {
    transform:none;
  }

  .tonearm-v3 .tonearm-moving,
  .record-dialog.is-playing .tonearm-v3 .tonearm-moving {
    transform:rotate(-8deg);
    transition:none;
  }
}

  <script type="application/json" id="track-data">{"tracks":[{"track_id":"ddcae047cdfa38f34431df950582dab927eaa224120e1859d7fb7efe346236e4","audio_url":"assets/audio/tracks/ddcae047cdfa38f34431df950582dab927eaa224120e1859d7fb7efe346236e4.mp3","audio_fallback_url":"assets/audio/tracks/ddcae047cdfa38f34431df950582dab927eaa224120e1859d7fb7efe346236e4.mp3","category":"vocal","cover_large_url":"assets/images/tracks/ddcae047cdfa38f34431df950582dab927eaa224120e1859d7fb7efe346236e4.jpeg","duration_ms":288444,"lyrics":"[Sad Intro]\n\n[Verse 1]\nThey said the sunshine would set me free,\nBut it’s feeling more like a cage to me.\nCrowded streets and skies so bright,\nStill can’t chase away the night.\n\nThe mountains rise, but my heart sinks low,\nThis isn’t the place I thought I’d grow.\nDreams out here are hard to hold,\nToo much glitter, not enough gold.\n\n[Chorus]\nI can’t stay here in California,\nThis life just don’t feel right.\nThe glitz and the glamor weigh me down,\nI need the quiet of my hometown.\nThe West Coast breeze ain’t what I need,\nI miss the stars and the open trees.\nI can’t stay here in California,\nIt’ll never be home.\n\n[Verse 2]\nI’ve tried to love these coastal skies,\nBut they can’t compare to a Southern sunrise.\nThe air don’t smell like rain on pine,\nAnd I can’t find peace in these endless lines.\n\nGolden hills, they shine and glow,\nBut they don’t call me when the lights get low.\nToo much noise, too little soul,\nCalifornia just ain’t my goal.\n\n[Chorus]\nI can’t stay here in California,\nThis life just don’t feel right.\nThe glitz and the glamor weigh me down,\nI need the quiet of my hometown.\nThe West Coast breeze ain’t what I need,\nI miss the stars and the open trees.\nI can’t stay here in California,\nIt’ll never be home.\n\n[Long Instrumental Break]\n\n[Bridge]\nGive me a dirt road, a little creek,\nThe kind of quiet that lets me speak.\nTrade this rush for a slower pace,\nSomewhere I can find my place.\n\n[Guitar Solo]\n\n[Verse 3]\nThe ocean whispers, “Stay a while,”\nBut I can’t fake another smile.\nThese city lights don’t warm my heart,\nIt’s time for me to make a new start.\n\n[Chorus]\nI can’t stay here in California,\nThis life just don’t feel right.\nThe glitz and the glamor weigh me down,\nI need the quiet of my hometown.\nThe West Coast breeze ain’t what I need,\nI miss the stars and the open trees.\nI can’t stay here in California,\nIt’ll never be home."},{"track_id":"cf0671fff55ac0dbfb25c47495a042edbf6384935f315f1bb39cfea7851f5ab7","audio_url":"assets/audio/tracks/cf0671fff55ac0dbfb25c47495a042edbf6384935f315f1bb39cfea7851f5ab7.mp3","audio_fallback_url":"assets/audio/tracks/cf0671fff55ac0dbfb25c47495a042edbf6384935f315f1bb39cfea7851f5ab7.mp3","category":"vocal","cover_large_url":"assets/images/tracks/cf0671fff55ac0dbfb25c47495a042edbf6384935f315f1bb39cfea7851f5ab7.jpeg","duration_ms":121600,"lyrics":"I check the mirror\n the circle’s getting wider,  smooth and pale\nThe doctor leaned back, she didn't even blink\nShe said, \"It’s the way that you think. stop stressing.\nJust set down your burdens, let the worry go.\"\nLike I’m holding onto them and asking them to grow.\n​\n the world’s on fire and the rent’s too high\nAnd we’re all just watching the days go by\nthe world is dying and the patch is growing\nA little more skin every day is showing\nHard to keep a head of hair\nWhen there's nothing left but thin, cold air.\n​\nThere’s hatred on the corner, there’s hunger in the street\nPeople working eighty hours just to find a place to sleep\nI’m trying to find \"peace\" and finding only \"war\"\nThen I’m wondering why my strands are lying on the floor\n\nMy hair is leaving town, it’s had enough of the news\nI'm singing the blues.\n​\nIt’s a tiny little target on the back of my head\nFor every heavy word that the anchors said\nFor every grocery bill that makes me want to cry\nMy beauty’s being borrowed by the \"how\" and the \"why.\"\n​\nA little bit bigger today.\nA little bit more of me fading away.\nJust stop stressing, she said with a grin...\nWhile the whole wide world is caving in.\n\n​my bald spot is growing\nthe ugliness i feel\nmakes the spot keep growing\nhow do we heal"},{"track_id":"86baa451f434f66e4e16860f9347e47a50477f0c947cd35ff095dab05ba43729","audio_url":"assets/audio/tracks/86baa451f434f66e4e16860f9347e47a50477f0c947cd35ff095dab05ba43729.mp3","audio_fallback_url":"assets/audio/tracks/86baa451f434f66e4e16860f9347e47a50477f0c947cd35ff095dab05ba43729.mp3","category":"vocal","cover_large_url":"assets/images/tracks/86baa451f434f66e4e16860f9347e47a50477f0c947cd35ff095dab05ba43729.jpeg","duration_ms":171128,"lyrics":"Verse 1\nWe plant the seeds in open ground,\nLet quiet hope begin to sound,\nNew ideas take root tonight,\nWatch our courage find its light.\nWe branch out past every fear,\nFeel our budding talent drawing near.\n\nPre-Chorus\nStep by step we learn to fly,\nWe spread our wings across the sky.\n\nChorus\nWe grow by leaps and bounds, hear the rhythm in our hearts,\nDreams blossom into something brighter from the start.\nEven small sparks bear fruit in time,\nNow our future’s in full bloom, alive.\n\nVerse 2\nWe reach for the stars, no looking down,\nWatch new visions spring to life around,\nEvery challenge helps us rise to the occasion,\nTurning doubt to elevation.\nWe expand our horizons, moving on,\nEvery shadow turns to dawn.\n\nPre-Chorus\nLet the old fears fade away,\nWe grow into our own today.\n\nChorus\nWe grow by leaps and bounds, feel the moment taking flight,\nHearts begin to take off in the light.\nAll our efforts build on success,\nEvery step becomes our progress.\n\nBridge\nWe break new ground, no fear of change,\nDreams climb new heights, wide and strange,\nHope can rise like a phoenix through the night,\nTurning every fall to flight.\n\nFinal Chorus\nWe branch out, we spread our wings, we believe in what we’ve found,\nEvery voice and every story lifting higher from the ground.\nSeeds we planted long ago\nNow burst into bloom and glow.\n\nOutro\nLet it grow, let it grow,\nWatch tomorrow’s colors show."},{"track_id":"4c4f91ae1b145702af6a29176a8c51bf2ebf8b5e83f9f311a437dd690042e0d8","audio_url":"assets/audio/tracks/4c4f91ae1b145702af6a29176a8c51bf2ebf8b5e83f9f311a437dd690042e0d8.mp3","audio_fallback_url":"assets/audio/tracks/4c4f91ae1b145702af6a29176a8c51bf2ebf8b5e83f9f311a437dd690042e0d8.mp3","category":"vocal","cover_large_url":"assets/images/tracks/4c4f91ae1b145702af6a29176a8c51bf2ebf8b5e83f9f311a437dd690042e0d8.jpeg","duration_ms":144536,"lyrics":"(Verse 1)\nSylvia asked from behind the glass\nIs there no way out of the mind\nThe books were stacked, the shelves were full\nBut the door she could not find\n(Verse 2)\nThe wolf climbed up the tower stairs\nOne more page, one more light\nThe library gleamed, the stockings shone\nBut no one slept at night\n(Chorus)\nThe way out of the mind\nIs not another thought\nIt’s the floor beneath your feet\nThe strings your fingers caught\nIt’s the needle and the breath\nThe toes you finally feel\nThe way out of the mind, my love\nIs everything that’s real\n(Verse 3)\nPhoebe sat down on the wood\nNo shoes, no suit, no name\nShe closed her eyes, she found a chord\nAnd nothing was the same\n(Bridge)\nFerme la porte de la tour\nDescends pieds nus ce soir\nLe loup n’a plus besoin de lire\nIl a besoin de voir\n(Last Chorus)\nThe way out of the mind\nIs not another word\nIt’s the song you finally sing\nAfter all the ones you’ve heard\nIt’s one last dance with her\nBefore you close your eyes\nThe way out of the mind, my love\nIs where the body lies\n(Outro)\nGo sing, Daniel.\nFeel your toes.\nOne last dance."},{"track_id":"c1da68535861dccc15211732855aef50d1f4d3cecb7fbede77ef43bc4e792d79","audio_url":"assets/audio/tracks/c1da68535861dccc15211732855aef50d1f4d3cecb7fbede77ef43bc4e792d79.mp3","audio_fallback_url":"assets/audio/tracks/c1da68535861dccc15211732855aef50d1f4d3cecb7fbede77ef43bc4e792d79.mp3","category":"vocal","cover_large_url":"assets/images/tracks/c1da68535861dccc15211732855aef50d1f4d3cecb7fbede77ef43bc4e792d79.jpeg","duration_ms":253571,"lyrics":"I breathe in peace, the simple joy of now I honor all the wisdom that the present allows My cup is full, I have everything I need right here Surrounded by soft connections, holding love so near I give and receive freely, a beautiful, steady flow I am seen, I am cherished, loved deeply as I go.\n\nNow the ground is firm beneath my gentle feet A powerful knowing, perfectly complete. I listen close to the inner guidance I hold true.\n\nI am steady light, unbothered by the noise outside I am confidence, where courage loves to reside I step forward now, with clear intent and heart ablaze I move mountains gently, in a thousand patient ways I succeed now, I achieve now, the outcome is clear and bright My inner strength is my constant guiding light.\n\nMy intuition speaks softly, a wisdom that guides my way The Universe unfolds beauty, every single day Everything arrives for me, in the perfect, knowing time I trust the flow of life, a rhythm so sublime My body is resilient, strong and full of grace My spirit is vibrant, illuminating every space.\n\nLike a river flowing, perfectly on time Every drop is necessary, a beautiful design I release all worry, all the need to rush I am brave, I am persistent, and success is in my touch. My whole being is filled with strength, glowing, alive, and free.\n\nI am steady light, unbothered by the noise outside I am confidence, where courage loves to reside I step forward now, with clear intent and heart ablaze I move mountains gently, in a thousand patient ways I succeed now, I achieve now, the outcome is clear and bright My inner strength is my constant guiding light.\n\n\"Strong and peaceful...\" \"Loved and thriving...\" \"The perfect time is always now...\" \"It is done, it is complete, it is well...\""},{"track_id":"7b40e0f101b168ccba1c89f5448daf1c6f4854360018bb161bb791ccddd1da85","audio_url":"assets/audio/tracks/7b40e0  are\nUsed the needle of your compass to sew up your broken heart\nAsk directions from a genie in a bottle of Jim Beam\nAnd she lies to you\nThat's when you'll learn the truth\n\n**[Verse 3]**\nMet a man down on the corner, said he’d make my pain disappear\nWhite powder in a baggie, whispered, \"Baby, have no fear\"\nBut the high don’t last forever, and the crash is twice as mean\nNow the devil’s got my number, and he’s callin’ in his debt\n\n**[Verse 4]**\nDealer’s knockin’ at the door now, says I owe him one more time\nBut the money’s gone, the stash is low, and I’m runnin’ out of lies\nHe’s got a grin like a razor, and his patience’s wearin’ thin\nI can see the fire in his eyes, but I can’t let him drag me in\n\n**[Chorus]**\nIf you're goin’ through hell keep on goin’\nDon’t slow down if you're scared don’t show it\nYou might get out before the devil even knows you're there\n\n**[Verse 5]**\nI’ve been deep down in that darkness\nI’ve been down to my last match\nFelt a hundred different demons breathin’ fire down my back\nAnd I knew that if I stumbled I’d fall right into the trap\nThat they were layin’, yeah\nBut the good news is there’s angels everywhere out on the street\nHoldin’ out a hand to pull you back up on your feet\nThe ones that you’ve been draggin’ for so long\nYou’re on your knees you might as well be prayin’\nGuess what I’m sayin’\n\n**[Bridge]**\nMeth smoke curls around the ceiling, shadows dancin’ on the wall\nEvery hit’s a little freedom, every crash is ten times worse\nBut the needle’s callin’ like a siren, and the dealer’s at the door\nI gotta break this chain before it drags me to the floor\n\n**[Verse 6]**\nMama’s voice still echoes, sayin’, \"Boy, you’re better than this mess\"\nBut the high’s got me convinced that I can’t live without its kiss\nYet somewhere deep inside me, there’s a spark that won’t go out\nMaybe it’s the angels, maybe it’s the doubt\n\n**[Chorus]**\nIf you're goin’ through hell keep on movin’\nFace that fire, walk right through it\nYou might get out before the devil even knows you're there\nYeah, if you're goin’ through hell keep on goin’\nDon’t look back, just keep your eyes straight ahead\nYou might get out before the devil even knows you're there\n\n**[Outro]**\nOne day I’ll wake up sober, with the sun instead of shame\nThe dealer’s just a memory, and the pain won’t have a name\nTill then I’ll keep on walkin’, through the fire, through the rain\nIf you’re goin’ through hell, don’t you stop—just keep on goin’ the same\n\n---"},{"track_id":"0048db3d77b26f54a02b69820bf3d7d88cbd867f466606e8694271f21d567cad","audio_url":"assets/audio/tracks/0048db3d77b26f54a02b69820bf3d7d88cbd867f466606e8694271f21d567cad.mp3","audio_fallback_url":"assets/audio/tracks/0048db3d77b26f54a02b69820bf3d7d88cbd867f466606e8694271f21d567cad.mp3","category":"vocal","cover_large_url":"assets/images/tracks/0048db3d77b26f54a02b69820bf3d7d88cbd867f466606e8694271f21d567cad.jpeg","duration_ms":173427,"lyrics":"[Verse 1]\nYou packed your bags\nLeft your toothbrush by the sink\nSaid\n\"We need time\"\nLike it’s something we can drink\nDoor hit the frame\nAnd the frames shook on the wall\nI watched our summer\nFold into the fall\n\n[Chorus]\nIt’s not the end\nJust feels like it tonight\nWe’re bending\nNot breaking\nJust lost in the fight\nIf love is a story\nWe’re stuck on a page\nIt’s not the end\nIt’s a turn in the phrase\n(yeah, we’ll turn this page)\n\n[Verse 2]\nYour sweater’s still\nOn the chair beside the bed\nI talk to it\nLike you’re here inside my head\nI make two cups\nStill forget you’re not around\nThen laugh a little\nAt how loud this quiet sounds\n\n[Chorus]\nIt’s not the end\nJust feels like it tonight\nWe’re bending\nNot breaking\nJust lost in the fight\nIf love is a story\nWe’re stuck on a page\nIt’s not the end\nIt’s a turn in the phrase\n(we’ll turn this page)\n\n[Bridge]\nOne more call\nCould change it all (oh-oh)\nOne slow walk\nBack up the hall\nIf this is the part\nWhere we almost break\nHold my ha         !raw

        || raw.ordinal !== expected.ordinal
        || !Number.isInteger(raw.start_ms)

    const openToken = token;

    clearCurrentMarker();
    setState(states.OPENING);

    currentPair = nextPair;
    currentRole = role;
    position = {original:0, cover:0};
    endedPosition = {original:false, cover:false};

    sourceFallbackAttempted = false;
    activeDuration = current.duration_ms / 1000;
    currentWave = null;
    currentCard = member;
    returnFocus = member;
    heights = new Float32Array(30);
    clearVisualFields();
    dialog.classList.add('cover-mode');
    dialog.setAttribute('aria-describedby', 'player-status');
    setCurrentMarker(member);
    title.textContent = `${nextPair.from_genre} → ${nextPair.to_genre}`;
    if (coverVariantSwitcher) coverVariantSwitcher.hidden = false;
    updateCoverRoleUi();

    lyricsColumn.hidden = false;
    lyricsColumn.removeAttribute('aria-hidden');
    loadAudioSource(current.audio_url);
    const openIdentity = captureSourceIdentity();

    loadCoverVisuals(openIdentity);
    seek.max = String(activeDuration);
    seek.value = '0';
    durationText.textContent = fmt(activeDuration);

      currentMode !== 'cover'
      || !currentPair
      || (role !== 'original' && role !== 'cover')
      || !currentPair[role]
      || role === currentRole
      || state === states.CLOSING
      || state === states.CLOSED

    invalidatePlayIntent();

    wasPlayingBeforeSeek = false;
    pendingSeek = null;
    variantEpoch += 1;

    sourceFallbackAttempted = false;

    setCurrentMarker(currentCard);

        pendingPlayEpoch = 0;
      }

    }

      if (desiredPlaying) invalidatePlayIntent();

      statusText.textContent = pendingSeek === null ? 'Paused' : 'Seek will apply when audio is ready.';
      updatePlayButton();

  seek.addEventListener('pointerup', finishSeek);
  seek.addEventListener('pointercancel', finishSeek);

    if (event.key === 'ArrowRight') target = audio.currentTime + 5;
    if (event.key === 'Home') target = 0;
    if (event.key === 'End') target = durationOf();
    if (target !== null) {

      seek.value = String(target);
      updateProgress();
      lyricsController.sync(target, {forceScroll:true, instant:true});
      if (target >= Math.max(0, durationOf() - .05)) {
        invalidatePlayIntent();
        if (currentMode === 'cover' && currentRole) endedPosition[currentRole] = true;
        audio.pause();
        setState(states.ENDED);
        statusText.textContent = 'Ended — replay when ready.';
        updatePlayButton();
        stopAnimation();

        setState(states.PAUSED);
        statusText.textContent = 'Paused';

    canvasContext = canvas.getContext('2d', {alpha:false});

  } catch (error) {

    dialog.classList.add('canvas-fallback');
  }

      clearSourceStallTimer();
      stopAnimation();
      if (layoutRaf) cancelAnimationFrame(layoutRaf);
      layoutRaf = 0;
    } else {
      scheduleLayout(token);
      if (context && mediaNode && context.state !== 'running' && desiredPlaying && pendingPlayEpoch === 0) {

        updatePlayButton();
        stopAnimation();
      } else {
        if (desiredPlaying && (!sourcePlaybackConfirmed || audio.paused || audio.readyState < 3)) armSourceStallTimer('visibility');
        runAnimation();
      }
    }
  });

    if (reduceMotion.matches) stopAnimation();
    else runAnimation();
    updatePlayButton();
    draw(performance.now());
  };
  if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', motionChanged);
  else reduceMotion.addListener(motionChanged);

(() => {
  const template = document.getElementById("deferred-page-font");
  const install = () => document.head.append(template.content.cloneNode(true));
  if ("requestIdleCallback" in window) requestIdleCallback(install, {timeout:2500});
  else setTimeout(install, 0);
})();
</script>

<script>
(() => {
  const categories = Object.freeze({
    vocal: Object.freeze({
      id: 'vocal',
      name: 'Vocals',
      description: 'Hyper-realistic vocal timbre with highly engaging top-lines.',
    }),
    instrumental: Object.freeze({
      id: 'instrumental',
      name: 'Arrangement / Instrumentation',
      description: 'The instrumentation features idiomatic phrasing that reflects authentic performance techniques, while delivering excellent spatial depth within the mix.',
    }),
    local: Object.freeze({
      id: 'local',
      name: 'Regional Genres',
      description: 'Professional-grade expansion of the Chinese regional music catalog, specifically fine-tuned for signature sub-genres such as Zhongguofeng (Chinese Traditional Fusion), Gufeng Pop, and Folk.',
    }),
  });
  document.querySelectorAll('[data-category-key]').forEach(element => {
    const category = categories[element.dataset.categoryKey];
    if (!category) throw new Error(`Unknown category: ${element.dataset.categoryKey}`);
    element.textContent = category.name;
    if (element.matches('.topnav a')) element.href = `#${category.id}`;
  });
  document.querySelectorAll('[data-category-description]').forEach(element => {
    const category = categories[element.dataset.categoryDescription];
    if (!category) throw new Error(`Unknown category: ${element.dataset.categoryDescription}`);
    element.textContent = category.description;
  });
})();
</script>

<script>
(() => {
  document.querySelectorAll('.demo-section[data-style-filter]').forEach(section => {
    const buttons = [...section.querySelectorAll('.style-chip')];
    const cards = [...section.querySelectorAll('.demo-card[data-style]')];
    const applyStyle = style => {
      cards.forEach(card => { card.hidden = style !== '*' && card.dataset.style !== style; });
      buttons.forEach(button => {
        const active = button.dataset.style === style;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
    };
    buttons.forEach(button => button.addEventListener('click', () => applyStyle(button.dataset.style)));
    applyStyle('*');
  });
})();
</script>
</body>
</html>
